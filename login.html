<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Event Hub | Login</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-bg"><main class="auth-card"><div class="brand"><span class="brand-icon">E</span><div><h1>Campus Event Hub</h1><small>Discover campus life</small></div></div><div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Create account</button></div>
<form id="authForm"><div id="nameWrap" class="hidden"><label>Full name</label><input name="name" placeholder="Your name"></div><label>Email</label><input name="email" type="email" placeholder="you@college.edu" required><label>Password</label><input name="password" type="password" placeholder="At least 6 characters" required minlength="6"><button class="primary full" type="submit" id="authBtn">Login</button></form><p id="authMessage" class="message"></p><p class="hint">Create a student account to register for events.</p></main><script src="login.js"></script></body></html>
